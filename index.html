<!DOCTYPE html>

  <meta name="theme-color" content="#0f172a">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { accent: '#6366f1', 'accent-soft': '#818cf8' },
          animation: {
            'slide-up-sheet': 'slideUpSheet 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'fade-in': 'fadeIn 0.3s ease-out',
            'float': 'float 6s ease-in-out infinite',
          },
          keyframes: {
            slideUpSheet: { '0%': { transform: 'translateY(100%)', opacity: 0 }, '100%': { transform: 'translateY(0)', opacity: 1 } },
            fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
            float: { '0%,100%': { transform: 'translateY(0px)' }, '50%': { transform: 'translateY(-10px)' } },
          },
        },
      },
    }
  </script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', 'Hind Siliguri', system-ui, sans-serif;
      background: radial-gradient(ellipse at top, #1e293b 0%, #0f172a 50%, #020617 100%);
      background-attachment: fixed; min-height: 100vh; color: #e2e8f0; overscroll-behavior-y: none;
    }
    .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
    .glass-card { background: rgba(255,255,255,0.03); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); transition: all 0.2s ease; }
    .glass-card:active { transform: scale(0.98); background: rgba(255,255,255,0.06); }
    .glass-input { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: #f1f5f9; transition: all 0.25s; width: 100%; }
    .glass-input:focus { outline: none; border-color: #818cf8; background: rgba(0,0,0,0.4); box-shadow: 0 0 0 2px rgba(99,102,241,0.2); }
    select option { background-color: #0f172a; color: white; }
    
    .btn-glass {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #f8fafc;
      font-weight: 600; transition: all 0.2s; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    .btn-glass:active { transform: scale(0.95); }
    .btn-primary { background: linear-gradient(135deg, rgba(99,102,241,0.8), rgba(79,70,229,0.8)); border-color: rgba(129,140,248,0.5); box-shadow: 0 4px 15px rgba(79,70,229,0.3); }
    .btn-danger { background: rgba(239,68,68,0.15); border-color: rgba(248,113,113,0.3); color: #fca5a5; }
    .btn-success { background: rgba(16,185,129,0.2); border-color: rgba(52,211,153,0.4); }
    
    /* Modals - Bottom Sheet for Mobile */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
      display: flex; flex-direction: column; justify-content: flex-end; z-index: 1000;
    }
    @media (min-width: 640px) { .modal-overlay { justify-content: center; padding: 2rem; } }
    
    .modal-content {
      width: 100%; background: #0f172a; border-top: 1px solid rgba(255,255,255,0.15); border-top-left-radius: 1.5rem; border-top-right-radius: 1.5rem;
      padding: 1.5rem; padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
      max-height: 90vh; overflow-y: auto;
    }
    @media (min-width: 640px) { .modal-content { max-width: 32rem; margin: 0 auto; border-radius: 1.5rem; border: 1px solid rgba(255,255,255,0.15); } }

    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    
    .toast {
      position: fixed; top: 2rem; left: 50%; transform: translateX(-50%); z-index: 2000;
      animation: fadeIn 0.3s ease-out; background: rgba(15,23,42,0.95); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 1rem; padding: 0.75rem 1.5rem; font-size: 0.9rem; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .bottom-nav {
      background: rgba(15,23,42,0.9); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.05);
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
</head>
<body class="antialiased">

  <div id="app" class="min-h-screen flex flex-col"></div>

  <script type="module">

    import { getFirestore, collection, doc, setDoc, query, where, updateDoc, deleteDoc, writeBatch, serverTimestamp, onSnapshot, orderBy, limit } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDbWY8lrAmw0-Ao43SGuFqLt6ulP1Vxr1U",
      authDomain: "jrs-cloud-476ef.firebaseapp.com",
      projectId: "jrs-cloud-476ef",
      storageBucket: "jrs-cloud-476ef.firebasestorage.app",
      messagingSenderId: "322592273401",
      appId: "1:322592273401:web:5661912525d04281380328",
      measurementId: "G-SGNXLEHEWD"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    window.db = db; window.auth = auth;
    window.Fb = { createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail, collection, doc, setDoc, query, where, updateDoc, deleteDoc, writeBatch, serverTimestamp, onSnapshot, orderBy, limit };
  </script>

  <script type="module">
    const { createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail, collection, doc, setDoc, query, where, updateDoc, deleteDoc, writeBatch, serverTimestamp, onSnapshot, orderBy } = window.Fb;
    const db = window.db, auth = window.auth;
    const googleProvider = new GoogleAuthProvider();

    const AppState = {
      user: null, contacts: [], categories: [], sections: {},
      selectedCategory: 'All', selectedSection: 'All', searchQuery: '',
      editingContact: null, viewMode: 'list',
      authMode: 'login'
    };

    const DEFAULT_CATEGORIES = ['আমাদের গ্রাম', 'অফিস'];
    const DEFAULT_SECTIONS = { 'অফিস': ['কাটিং', 'সেলাই', 'ফিনিশিং', 'প্যাকিং'] };

    const $ = (sel) => document.querySelector(sel);
    const escapeHtml = (t) => !t ? '' : String(t).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m]||m);
    
    const showToast = (msg, type='info') => {
      const existing = $('.toast'); if (existing) existing.remove();
      const toast = document.createElement('div');
      let colorClass = type === 'success' ? 'text-emerald-400' : type === 'error' ? 'text-red-400' : 'text-indigo-300';
      toast.className = `toast ${colorClass}`;
      toast.innerHTML = `<div class="flex items-center gap-2"><span>${type==='success'?'✅':type==='error'?'⚠️':'ℹ️'}</span> ${msg}</div>`;
      document.body.appendChild(toast);
      setTimeout(() => { toast.style.opacity='0'; toast.style.transition='opacity 0.3s'; setTimeout(()=>toast.remove(),300); }, 3000);
    };

    function renderApp() {
      const appEl = $('#app');
      if (!AppState.user) { appEl.innerHTML = AuthUI(); attachAuthListeners(); }
      else { appEl.innerHTML = DashboardUI(); attachDashboardListeners(); loadUserData(); }
    }

    // ========== AUTH UI ==========
    function AuthUI() {
      const isLogin = AppState.authMode === 'login';
      const isSignup = AppState.authMode === 'signup';
      const isForgot = AppState.authMode === 'forgot';
      return `
        <div class="flex items-center justify-center min-h-screen p-4">
          <div class="glass w-full max-w-md p-8 rounded-[2rem] space-y-6 relative z-10 animate-fade-in shadow-2xl shadow-indigo-900/20">
            <div class="text-center">
              <div class="text-6xl mb-4 animate-float inline-block">☁️</div>
              <h1 class="text-3xl font-extrabold bg-gradient-to-r from-indigo-300 to-purple-300 bg-clip-text text-transparent">JRS Cloud</h1>
              <p class="text-slate-400 text-sm mt-2 font-medium">স্মার্ট কন্টাক্ট ম্যানেজমেন্ট সিস্টেম</p>
            </div>
            <div id="auth-form-container" class="space-y-4">
              ${isForgot ? `
                <div class="animate-fade-in space-y-3">
                  <input type="email" id="reset-email" class="glass-input rounded-xl px-4 py-3.5" placeholder="আপনার ইমেইল অ্যাড্রেস">
                  <button id="btn-reset-password" class="btn-glass btn-primary w-full py-3.5 rounded-xl font-bold">🔑 রিসেট লিংক পাঠান</button>
                  <button id="btn-back-to-login" class="btn-glass w-full py-3 rounded-xl text-sm border-transparent hover:bg-white/5">← ফিরে যান</button>
                  <div id="reset-error" class="text-red-400 text-sm hidden text-center"></div>
                  <div id="reset-success" class="text-emerald-400 text-sm hidden text-center"></div>
                </div>
              ` : isSignup ? `
                <div class="animate-fade-in space-y-3">
                  <input type="email" id="signup-email" class="glass-input rounded-xl px-4 py-3.5" placeholder="ইমেইল অ্যাড্রেস">
                  <input type="password" id="signup-password" class="glass-input rounded-xl px-4 py-3.5" placeholder="পাসওয়ার্ড">
                  <input type="password" id="signup-confirm" class="glass-input rounded-xl px-4 py-3.5" placeholder="পাসওয়ার্ড নিশ্চিত করুন">
                  <div id="signup-error" class="text-red-400 text-sm hidden text-center"></div>
                  <button id="btn-signup-submit" class="btn-glass btn-primary w-full py-3.5 rounded-xl font-bold mt-2">📝 অ্যাকাউন্ট খুলুন</button>
                  <button id="btn-goto-login" class="btn-glass w-full py-3 rounded-xl text-sm border-transparent hover:bg-white/5">← লগইন পেজে ফিরে যান</button>
                </div>
              ` : `
                <div class="animate-fade-in space-y-3">
                  <input type="email" id="login-email" class="glass-input rounded-xl px-4 py-3.5" placeholder="ইমেইল অ্যাড্রেস">
                  <input type="password" id="login-password" class="glass-input rounded-xl px-4 py-3.5" placeholder="পাসওয়ার্ড">
                  <div id="login-error" class="text-red-400 text-sm hidden text-center"></div>
                  <button id="btn-login-submit" class="btn-glass btn-primary w-full py-3.5 rounded-xl font-bold mt-2 text-lg">লগইন</button>
                  <div class="flex justify-between text-sm px-1 py-2">
                    <button id="btn-forgot-password" class="text-indigo-300 hover:text-indigo-200">পাসওয়ার্ড ভুলে গেছেন?</button>
                    <button id="btn-goto-signup" class="text-purple-300 hover:text-purple-200 font-semibold">নতুন অ্যাকাউন্ট</button>
                  </div>
                  <div class="flex items-center gap-3 my-2"><div class="h-px flex-1 bg-white/10"></div><span class="text-xs text-slate-500 uppercase tracking-wider">অথবা</span><div class="h-px flex-1 bg-white/10"></div></div>
                  <button id="btn-google-login" class="btn-glass w-full py-3.5 rounded-xl flex items-center justify-center gap-3 bg-white/5 hover:bg-white/10 border-white/10 text-[15px] font-medium">
                    <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                    Google দিয়ে লগইন করুন
                  </button>
                </div>
              `}
            </div>
          </div>
        </div>`;
    }

    // ========== DASHBOARD UI ==========
    function DashboardUI() {
      const u = AppState.user;
      return `
        <div class="flex flex-col min-h-screen animate-fade-in pb-24 md:pb-8">
          <header class="glass mx-3 sm:mx-4 mt-3 sm:mt-4 px-5 py-3 sm:py-4 flex items-center justify-between rounded-[1.25rem] z-10 sticky top-3">
            <div class="flex items-center gap-3"><span class="text-2xl sm:text-3xl">☁️</span><h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight">JRS Cloud</h1></div>
            <div class="flex items-center gap-3">
              <img src="${u.photoURL || 'https://ui-avatars.com/api/?name='+u.email+'&background=6366f1&color=fff'}" class="w-9 h-9 rounded-full object-cover border-2 border-indigo-500/30" alt="Profile">
              <button id="btn-manage-cats" class="btn-glass p-2.5 rounded-xl hidden sm:flex bg-white/5 border-white/10" title="ক্যাটাগরি সেটিং">📂</button>
              <button id="btn-logout" class="btn-glass p-2.5 rounded-xl hidden sm:flex bg-red-500/10 border-red-500/20 text-red-400 hover:bg-red-500/20" title="লগআউট">🚪</button>
            </div>
          </header>

          <div class="px-3 sm:px-4 mt-4 grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4">
            <div class="glass-card p-4 sm:p-5 rounded-[1.25rem] flex flex-col items-center justify-center">
               <span class="text-3xl sm:text-4xl mb-1">📇</span><p class="text-2xl sm:text-3xl font-bold text-white" id="stat-total">0</p><p class="text-xs text-slate-400 font-medium">মোট কন্টাক্ট</p>
            </div>
            <div class="glass-card p-4 sm:p-5 rounded-[1.25rem] flex flex-col items-center justify-center">
               <span class="text-3xl sm:text-4xl mb-1">🏘️</span><p class="text-2xl sm:text-3xl font-bold text-indigo-300" id="stat-village">0</p><p class="text-xs text-slate-400 font-medium">গ্রাম</p>
            </div>
            <div class="glass-card p-4 sm:p-5 rounded-[1.25rem] flex flex-col items-center justify-center">
               <span class="text-3xl sm:text-4xl mb-1">🏢</span><p class="text-2xl sm:text-3xl font-bold text-emerald-300" id="stat-office">0</p><p class="text-xs text-slate-400 font-medium">অফিস</p>
            </div>
            <div class="glass-card p-4 sm:p-5 rounded-[1.25rem] flex flex-col items-center justify-center">
               <span class="text-3xl sm:text-4xl mb-1">🎨</span><p class="text-2xl sm:text-3xl font-bold text-amber-300" id="stat-custom">0</p><p class="text-xs text-slate-400 font-medium">অন্যান্য</p>
            </div>
          </div>

          <div class="px-3 sm:px-4 mt-4 space-y-3">
            <div class="flex flex-wrap gap-2 sm:gap-3">
              <button id="btn-add-contact" class="btn-glass btn-primary flex-1 sm:flex-none text-[15px] px-5 py-3 rounded-xl font-bold shadow-lg shadow-indigo-500/20">➕ নতুন কন্টাক্ট</button>
              <button id="btn-import-vcf" class="btn-glass bg-emerald-500/20 border-emerald-500/30 text-emerald-100 flex-1 sm:flex-none text-sm px-4 py-3 rounded-xl font-medium">📥 VCF ইম্পোর্ট</button>
              <button id="btn-export-csv" class="btn-glass bg-amber-500/10 border-amber-500/20 text-amber-200 flex-1 sm:flex-none text-sm px-4 py-3 rounded-xl font-medium">📤 CSV এক্সপোর্ট</button>
            </div>

            <div class="glass-card p-3 rounded-2xl flex flex-col sm:flex-row gap-3 items-center">
              <div class="relative w-full sm:flex-1">
                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">🔍</span>
                <input type="text" id="search-input" class="glass-input w-full rounded-xl py-3 pl-10 pr-10 text-sm" placeholder="নাম, নম্বর বা ট্যাগ দিয়ে খুঁজুন...">
                <button id="btn-clear-search" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-white p-1 hidden">✕</button>
              </div>
              <div class="flex gap-2 w-full sm:w-auto">
                <select id="filter-category" class="glass-input rounded-xl py-3 px-3 text-sm flex-1 sm:w-40 appearance-none font-medium"></select>
                <select id="filter-section" class="glass-input rounded-xl py-3 px-3 text-sm flex-1 sm:w-40 appearance-none font-medium"><option value="All">📁 সকল সেকশন</option></select>
              </div>
            </div>
          </div>

          <div class="flex-1 px-3 sm:px-4 mt-4 mb-4">
            <div id="contacts-container" class="space-y-3 pb-6">
              <div class="text-center py-20 text-slate-500">ডেটা লোড হচ্ছে...</div>
            </div>

          <button id="bn-categories" class="flex flex-col items-center justify-center w-full py-2 text-slate-400 active:scale-95 transition-transform"><span class="text-2xl mb-1">📂</span><span class="text-[11px] font-medium">ক্যাটাগরি</span></button>
          <button id="bn-import" class="flex flex-col items-center justify-center w-full py-2 text-slate-400 active:scale-95 transition-transform"><span class="text-2xl mb-1">📥</span><span class="text-[11px] font-medium">ইম্পোর্ট</span></button>
          <button id="bn-logout" class="flex flex-col items-center justify-center w-full py-2 text-red-400/80 active:scale-95 transition-transform"><span class="text-2xl mb-1">🚪</span><span class="text-[11px] font-medium">লগআউট</span></button>

        ${ContactModalUI()} ${ImportModalUI()} ${CategoryManageModalUI()}`;

    // ========== MODALS UI ==========
    function ContactModalUI() {
      return `
        <div id="contact-modal" class="modal-overlay hidden">
          <div class="modal-content animate-slide-up-sheet flex flex-col space-y-4">
            <div class="flex justify-between items-center mb-2">
              <h2 class="text-xl font-bold text-white flex items-center gap-2" id="modal-title">➕ নতুন কন্টাক্ট</h2>
              <button class="text-slate-400 hover:text-white bg-white/5 p-2 rounded-full close-modal">✕</button>
            </div>
            <div class="space-y-3 overflow-y-auto scrollbar-none pb-2">
              <input type="text" id="c-name" class="glass-input rounded-xl py-3.5 px-4" placeholder="👤 ব্যক্তির নাম (অবশ্যই দিন)">
              <input type="tel" id="c-phone" class="glass-input rounded-xl py-3.5 px-4" placeholder="📞 ফোন নম্বর (অবশ্যই দিন)">
              <input type="text" id="c-profession" class="glass-input rounded-xl py-3.5 px-4" placeholder="💼 পেশা বা পদবী (ঐচ্ছিক)">
              <input type="text" id="c-address" class="glass-input rounded-xl py-3.5 px-4" placeholder="📍 ঠিকানা (ঐচ্ছিক)">
              <div class="flex flex-col sm:flex-row gap-3">
                <select id="c-category" class="glass-input rounded-xl py-3.5 px-4 flex-1 appearance-none"></select>
                <select id="c-section" class="glass-input rounded-xl py-3.5 px-4 flex-1 appearance-none"><option value="">কোন সেকশন নেই</option></select>
              </div>
              <input type="text" id="c-tags" class="glass-input rounded-xl py-3.5 px-4" placeholder="🏷️ ট্যাগ (যেমন: #Manager, #VIP)">
            </div>

        $('#btn-forgot-password')?.addEventListener('click', ()=> { AppState.authMode='forgot'; renderApp(); });

      } else if (AppState.authMode === 'forgot') {

    async function loginWithEmail() {
      const email = $('#login-email').value.trim(), pass = $('#login-password').value;
      try { await signInWithEmailAndPassword(auth, email, pass); }
      catch(e) { showAuthError('login-error', e.message.replace('Firebase: ','')); }
    }
    async function loginWithGoogle() {
      try { await signInWithPopup(auth, googleProvider); }
      catch(e) { if(e.code !== 'auth/popup-closed-by-user') showAuthError('login-error', 'Google সাইন-ইন ব্যর্থ'); }

    async function signupWithEmail() {
      const email = $('#signup-email').value.trim(), pass = $('#signup-password').value, confirm = $('#signup-confirm').value;

      try { await createUserWithEmailAndPassword(auth, email, pass); }
      catch(e) { showAuthError('signup-error', e.message.replace('Firebase: ','')); }

    async function resetPassword() {

    function loadUserData() {
      const userRef = doc(db, 'users', AppState.user.uid);
      onSnapshot(userRef, (snap) => {
        if (snap.exists()) {
          const d = snap.data();
          AppState.categories = d.categories || [...DEFAULT_CATEGORIES];
          AppState.sections = d.sections || {...DEFAULT_SECTIONS};
        } else {
          AppState.categories = [...DEFAULT_CATEGORIES];
          AppState.sections = {...DEFAULT_SECTIONS};
          setDoc(userRef, { categories: AppState.categories, sections: AppState.sections, email: AppState.user.email, updatedAt: serverTimestamp() }, {merge:true});
        }
        updateFilterCategoryDropdown(); updateFilterSections(); updateSectionDropdownForForm(); populateCatModal();
      });
      const q = query(collection(db, 'users', AppState.user.uid, 'contacts'), orderBy('createdAt','desc'));
      onSnapshot(q, (snap) => {
        AppState.contacts = []; snap.forEach(d=>AppState.contacts.push({id:d.id,...d.data()}));
        renderContactList(); updateStats();
      });
    }

    async function saveContact() {

    async function handleVCFImport() {
      const file = $('#vcf-file').files?.[0]; if(!file) { $('#import-status').textContent='⚠️ আগে ফাইল সিলেক্ট করুন'; return; }
      $('#progress-container').classList.remove('hidden'); $('#import-status').textContent = 'ফাইল পড়া হচ্ছে...';
      const text = await file.text(); const vcards = text.split('END:VCARD').filter(b=>b.trim()).map(b=>b+'END:VCARD');
      if (vcards.length === 0) { $('#import-status').textContent = '❌ কোন ভিকার্ড (Contact) পাওয়া যায়নি'; return; }

      const batchSize = 400; const batches = []; let currentBatch = writeBatch(db); let ops = 0, total = 0;
      const ref = collection(db, 'users', AppState.user.uid, 'contacts');

      for (let i = 0; i < vcards.length; i++) {
        const nm = vcards[i].match(/FN:(.*)/), tel = vcards[i].match(/TEL[^:]*:(.*)/);
        if (nm && tel) {
          currentBatch.set(doc(ref), { name: nm[1].trim(), phone: tel[1].trim().replace(/[\s\-\(\)]/g,''), profession: '', address: '', category: AppState.categories[0] || 'আমাদের গ্রাম', section: null, tags: [], createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
          ops++; total++;
          if (ops >= batchSize) { batches.push(currentBatch); currentBatch = writeBatch(db); ops = 0; }
        }
        $('#progress-fill').style.width = Math.floor((i+1)/vcards.length*50)+'%'; $('#import-status').textContent = `প্রস্তুত হচ্ছে: ${i+1}/${vcards.length}`; await new Promise(r => setTimeout(r, 2));
      }
      if (ops > 0) batches.push(currentBatch);

      for (let i = 0; i < batches.length; i++) {
        await batches[i].commit();
        $('#progress-fill').style.width = (50 + Math.floor((i+1)/batches.length*50))+'%'; $('#import-status').textContent = `সেভ হচ্ছে (${i+1}/${batches.length})...`;
      }
      $('#import-status').innerHTML = `<span class="text-emerald-400">✅ ${total} টি কন্টাক্ট ইম্পোর্ট হয়েছে</span>`; showToast(`${total} কন্টাক্ট যুক্ত হয়েছে`,'success');
      setTimeout(()=>$('#import-modal').classList.add('hidden'), 2000);
    }

          </div>
        </div>`).join('');
        
      list.querySelectorAll('.del-cat').forEach(b=>b.onclick=async(e)=>{ const cat=e.currentTarget.dataset.cat; if(confirm(`"${cat}" ক্যাটাগরি ডিলিট করবেন?`)) { AppState.categories=AppState.categories.filter(c=>c!==cat); delete AppState.sections[cat]; await saveCats(); populateCatModal(); showToast('ক্যাটাগরি ডিলিট করা হয়েছে','info'); } });
      list.querySelectorAll('.del-sec').forEach(b=>b.onclick=async(e)=>{ const{cat,sec}=e.currentTarget.dataset; AppState.sections[cat]=(AppState.sections[cat]||[]).filter(s=>s!==sec); await saveCats(); populateCatModal(); });
      
      $('#sec-parent-cat').innerHTML = AppState.categories.map(c=>`<option value="${c}">${c}</option>`).join('');
    }

    async function addCategory() {
      const name = $('#new-cat-name').value.trim();
      if(!name) return showCatError('ক্যাটাগরির নাম দিন'); if(AppState.categories.includes(name)) return showCatError('এই ক্যাটাগরি আগেই আছে');
      AppState.categories.push(name); AppState.sections[name]=[]; await saveCats(); $('#new-cat-name').value=''; populateCatModal(); updateFilterCategoryDropdown(); showToast('ক্যাটাগরি যোগ হয়েছে','success');
    }
    async function addSection() {
      const name = $('#new-sec-name').value.trim(), cat = $('#sec-parent-cat').value;
      if(!name) return showCatError('সেকশনের নাম দিন'); if((AppState.sections[cat]||[]).includes(name)) return showCatError('এই সেকশন আগেই আছে');
      AppState.sections[cat] = [...(AppState.sections[cat]||[]), name]; await saveCats(); $('#new-sec-name').value=''; populateCatModal(); updateFilterSections(); showToast('সেকশন যোগ হয়েছে','success');
    }
    function showCatError(m) { const e=$('#cat-error'); e.textContent=m; e.classList.remove('hidden'); setTimeout(()=>e.classList.add('hidden'),3000); }
    async function saveCats() { await setDoc(doc(db,'users',AppState.user.uid),{categories:AppState.categories, sections:AppState.sections, updatedAt:serverTimestamp()},{merge:true}); }

    onAuthStateChanged(auth, (user) => { AppState.user = user; renderApp(); });
    renderApp();
  </script>
</body>
</html>
