<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>JRS Smart Cloud Directory</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="data:application/json,{}">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            accent: '#6366f1',
            'accent-soft': '#818cf8',
            surface: 'rgba(15,23,42,0.8)',
          },
          animation: {
            'float': 'float 6s ease-in-out infinite',
            'pulse-soft': 'pulseSoft 2s cubic-bezier(0.4,0,0.6,1) infinite',
            'slide-up': 'slideUp 0.3s ease-out',
            'fade-in': 'fadeIn 0.2s ease-out',
          },
          keyframes: {
            float: { '0%,100%': { transform: 'translateY(0px)' }, '50%': { transform: 'translateY(-10px)' } },
            pulseSoft: { '0%,100%': { opacity: 1 }, '50%': { opacity: 0.7 } },
            slideUp: { '0%': { transform: 'translateY(20px)', opacity: 0 }, '100%': { transform: 'translateY(0)', opacity: 1 } },
            fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
          },
        },
      },
    };
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Hind+Siliguri:wght@400;500;600;700&display=swap');
    :root {
      --glass-bg: rgba(255,255,255,0.06);
      --glass-border: rgba(255,255,255,0.12);
      --glass-bg-hover: rgba(255,255,255,0.1);
      --glass-bg-active: rgba(255,255,255,0.15);
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Hind Siliguri', system-ui, sans-serif;
      background: radial-gradient(ellipse at 20% 50%, #1e293b 0%, #0f172a 60%, #020617 100%);
      background-attachment: fixed;
      min-height: 100vh;
      color: #e2e8f0;
      -webkit-tap-highlight-color: transparent;
    }
    .glass { background: var(--glass-bg); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid var(--glass-border); }
    .glass-card { background: rgba(255,255,255,0.04); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,0.08); }
    .glass-input { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15); color: #f1f5f9; transition: all 0.25s; }
    .glass-input:focus { outline: none; border-color: #818cf8; box-shadow: 0 0 0 3px rgba(99,102,241,0.25); background: rgba(255,255,255,0.11); }
    .btn-glass { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #f8fafc; font-weight: 600; transition: all 0.25s; cursor: pointer; user-select: none; }
    .btn-glass:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.4); transform: translateY(-1px); box-shadow: 0 8px 25px -8px rgba(0,0,0,0.4); }
    .btn-glass:active { transform: scale(0.97); }
    .btn-primary { background: rgba(99,102,241,0.4); border-color: rgba(129,140,248,0.5); }
    .btn-primary:hover { background: rgba(99,102,241,0.55); }
    .btn-danger { border-color: rgba(248,113,113,0.4); }
    .btn-danger:hover { background: rgba(248,113,113,0.2); }
    .btn-success { background: rgba(16,185,129,0.25); border-color: rgba(52,211,153,0.4); }
    .tag {
      display: inline-flex; align-items: center; gap: 2px;
      background: rgba(99,102,241,0.2); border: 1px solid rgba(129,140,248,0.35);
      border-radius: 999px; padding: 0.2rem 0.7rem; font-size: 0.7rem; font-weight: 500;
      color: #c7d2fe; letter-spacing: 0.01em; white-space: nowrap;
    }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 1rem;
    }
    .scrollbar-thin::-webkit-scrollbar { width: 4px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
    .animate-slide-up { animation: slideUp 0.35s ease-out; }
    .animate-fade-in { animation: fadeIn 0.25s ease-out; }
    .contact-row { transition: all 0.2s; border-radius: 1rem; }
    .contact-row:hover { background: rgba(255,255,255,0.05); transform: translateY(-1px); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); z-index: 2000; animation: slideUp 0.4s ease-out; }
    .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 0.75rem; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    @media (max-width: 640px) {
      .glass { border-radius: 1rem; }
      .btn-glass { padding: 0.55rem 1rem; font-size: 0.85rem; }
    }
  </style>
</head>
<body class="antialiased">

  <div id="app" class="min-h-screen flex flex-col"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, getDocs, query, where, updateDoc, deleteDoc, writeBatch, serverTimestamp, onSnapshot, orderBy, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDbWY8lrAmw0-Ao43SGuFqLt6ulP1Vxr1U",
      authDomain: "jrs-cloud-476ef.firebaseapp.com",
      projectId: "jrs-cloud-476ef",
      storageBucket: "jrs-cloud-476ef.firebasestorage.app",
      messagingSenderId: "322592273401",
      appId: "1:322592273401:web:5661912525d04281380328",
      measurementId: "G-SGNXLEHEWD"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    window.db = db; window.auth = auth;
    window.Fb = { createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup, collection, doc, setDoc, getDocs, query, where, updateDoc, deleteDoc, writeBatch, serverTimestamp, onSnapshot, orderBy, arrayUnion, arrayRemove };
  </script>

  <script type="module">
    const { createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup, collection, doc, setDoc, getDocs, query, where, updateDoc, deleteDoc, writeBatch, serverTimestamp, onSnapshot, orderBy, arrayUnion, arrayRemove } = window.Fb;
    const db = window.db, auth = window.auth;
    const googleProvider = new GoogleAuthProvider();

    const AppState = {
      user: null, contacts: [], categories: [], sections: {},
      selectedCategory: 'All', selectedSection: 'All', searchQuery: '',
      editingContact: null, viewMode: 'list', // 'list' | 'grid'
      toasts: []
    };

    const DEFAULT_CATEGORIES = ['আমাদের গ্রাম', 'অফিস'];
    const DEFAULT_SECTIONS = { 'অফিস': ['কাটিং', 'সেলাই', 'ফিনিশিং', 'প্যাকিং'] };

    // ----- Helpers -----
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);
    const escapeHtml = (t) => !t ? '' : String(t).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m]||m);
    const showToast = (msg, type='info') => {
      const toast = document.createElement('div');
      toast.className = `toast glass-card px-5 py-3 text-sm font-medium ${type==='success'?'text-emerald-300 border-emerald-400/30':type==='error'?'text-red-300 border-red-400/30':'text-blue-200 border-blue-400/30'}`;
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => { toast.style.opacity='0'; toast.style.transition='opacity 0.3s'; setTimeout(()=>toast.remove(),300); }, 2500);
    };

    // ----- Render Loop -----
    function renderApp() {
      const appEl = $('#app');
      if (!AppState.user) { appEl.innerHTML = AuthUI(); attachAuthListeners(); }
      else { appEl.innerHTML = DashboardUI(); attachDashboardListeners(); loadUserData(); }
    }

    // ==================== AUTH UI ====================
    function AuthUI() {
      return `
        <div class="flex items-center justify-center min-h-screen p-4">
          <div class="glass w-full max-w-md p-8 space-y-6 animate-slide-up rounded-2xl">
            <div class="text-center">
              <div class="text-5xl mb-4 animate-float">☁️</div>
              <h1 class="text-3xl font-bold bg-gradient-to-r from-indigo-300 via-purple-200 to-indigo-300 bg-clip-text text-transparent">JRS Smart Cloud</h1>
              <p class="text-slate-400 mt-1 text-sm">পেশাদার কন্টাক্ট ম্যানেজমেন্ট</p>
            </div>
            <div class="space-y-3">
              <input type="email" id="auth-email" class="glass-input w-full rounded-xl px-4 py-3" placeholder="ইমেইল">
              <input type="password" id="auth-password" class="glass-input w-full rounded-xl px-4 py-3" placeholder="পাসওয়ার্ড">
              <div id="auth-error" class="text-red-400 text-xs hidden bg-red-500/10 p-2 rounded-lg"></div>
              <button id="btn-login" class="btn-glass btn-primary w-full py-3 rounded-xl">🔐 লগইন</button>
              <button id="btn-signup" class="btn-glass w-full py-3 rounded-xl bg-purple-500/20 border-purple-400/30 hover:bg-purple-500/30">📝 নতুন অ্যাকাউন্ট</button>
              <div class="flex items-center gap-3"><div class="h-px flex-1 bg-white/10"></div><span class="text-xs text-slate-500">অথবা</span><div class="h-px flex-1 bg-white/10"></div></div>
              <button id="btn-google" class="btn-glass w-full py-3 rounded-xl flex items-center justify-center gap-2 bg-white/5 hover:bg-white/10">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Google দিয়ে চালিয়ে যান
              </button>
            </div>
            <p class="text-[10px] text-slate-600 text-center">🔒 জিরো-নলেজ প্রাইভেসি — আপনার ডেটা শুধুমাত্র আপনার</p>
          </div>
        </div>`;
    }

    function attachAuthListeners() {
      $('#btn-login').onclick = async () => {
        try { hideAuthError(); await signInWithEmailAndPassword(auth, $('#auth-email').value, $('#auth-password').value); }
        catch(e) { showAuthError(e.message.replace('Firebase: ','').replace(/\(auth.*\)/,'')); }
      };
      $('#btn-signup').onclick = async () => {
        try { hideAuthError(); await createUserWithEmailAndPassword(auth, $('#auth-email').value, $('#auth-password').value); }
        catch(e) { showAuthError(e.message.replace('Firebase: ','').replace(/\(auth.*\)/,'')); }
      };
      $('#btn-google').onclick = async () => {
        try { hideAuthError(); await signInWithPopup(auth, googleProvider); }
        catch(e) { if(e.code !== 'auth/popup-closed-by-user') showAuthError('Google সাইন-ইন ব্যর্থ হয়েছে'); }
      };
    }
    function showAuthError(msg) { const el=$('#auth-error'); el.textContent='⚠️ '+msg; el.classList.remove('hidden'); }
    function hideAuthError() { $('#auth-error')?.classList.add('hidden'); }

    // ==================== DASHBOARD UI ====================
    function DashboardUI() {
      const u = AppState.user;
      return `
        <div class="flex flex-col min-h-screen animate-fade-in">
          <header class="glass mx-3 mt-3 px-5 py-3 flex items-center justify-between flex-wrap gap-3 rounded-2xl">
            <div class="flex items-center gap-2"><span class="text-2xl">☁️</span><h1 class="text-lg sm:text-xl font-bold text-white">JRS Directory</h1></div>
            <div class="flex items-center gap-2 sm:gap-3">
              <div class="hidden sm:flex items-center gap-2 text-xs text-slate-400 bg-white/5 rounded-full px-3 py-1.5">
                <img src="${u.photoURL || ''}" class="w-6 h-6 rounded-full object-cover ${u.photoURL?'':'hidden'}" onerror="this.style.display='none'" alt="">
                <span>${escapeHtml(u.displayName || u.email)}</span>
              </div>
              <button id="btn-manage-cats" class="btn-glass text-xs py-2 px-3" title="ক্যাটাগরি ও সেকশন">📂</button>
              <button id="btn-logout" class="btn-glass text-xs py-2 px-3 border-red-400/30 hover:bg-red-500/20">🚪</button>
            </div>
          </header>

          <div class="px-3 mt-3 grid grid-cols-2 md:grid-cols-4 gap-3" id="stats-cards">
            <div class="glass-card p-4 rounded-2xl text-center"><p class="text-2xl font-bold" id="stat-total">-</p><p class="text-[10px] text-slate-400 uppercase tracking-wider">মোট</p></div>
            <div class="glass-card p-4 rounded-2xl text-center"><p class="text-2xl font-bold" id="stat-village">-</p><p class="text-[10px] text-slate-400 uppercase tracking-wider">গ্রাম</p></div>
            <div class="glass-card p-4 rounded-2xl text-center"><p class="text-2xl font-bold" id="stat-office">-</p><p class="text-[10px] text-slate-400 uppercase tracking-wider">অফিস</p></div>
            <div class="glass-card p-4 rounded-2xl text-center"><p class="text-2xl font-bold" id="stat-custom">-</p><p class="text-[10px] text-slate-400 uppercase tracking-wider">কাস্টম</p></div>
          </div>

          <div class="px-3 mt-3 flex flex-wrap gap-2">
            <button id="btn-add-contact" class="btn-glass btn-primary text-sm px-4 py-2.5 rounded-xl">➕ নতুন</button>
            <button id="btn-import-vcf" class="btn-glass btn-success text-sm px-4 py-2.5 rounded-xl">📥 VCF ইম্পোর্ট</button>
            <button id="btn-export-csv" class="btn-glass text-sm px-4 py-2.5 rounded-xl bg-amber-500/15 border-amber-400/30">📤 CSV</button>
            <button id="btn-toggle-view" class="btn-glass text-sm px-4 py-2.5 rounded-xl ml-auto" title="ভিউ পরিবর্তন">📋</button>
          </div>

          <div class="px-3 mt-3 glass-card p-3 rounded-2xl flex flex-wrap gap-2 items-center">
            <input type="text" id="search-input" class="glass-input flex-1 min-w-[180px] rounded-xl py-2.5 px-4 text-sm" placeholder="🔍 নাম, ট্যাগ বা নম্বর...">
            <select id="filter-category" class="glass-input rounded-xl py-2.5 px-3 text-sm bg-transparent text-white"></select>
            <select id="filter-section" class="glass-input rounded-xl py-2.5 px-3 text-sm bg-transparent text-white"><option value="All">সকল সেকশন</option></select>
            <button id="btn-clear-search" class="text-xs text-slate-400 hover:text-white px-2" title="ক্লিয়ার">✕</button>
          </div>

          <div class="flex-1 px-3 mt-3 pb-24">
            <div id="contacts-container" class="space-y-2 max-h-[55vh] overflow-y-auto scrollbar-thin pr-0.5">
              <div class="text-center py-10 text-slate-500"><div class="skeleton h-16 w-full mb-2"></div><div class="skeleton h-16 w-3/4 mx-auto mb-2"></div><div class="skeleton h-16 w-5/6 mx-auto"></div></div>
            </div>
          </div>
        </div>
        ${ContactModalUI()} ${ImportModalUI()} ${CategoryManageModalUI()}
        <div id="toast-container"></div>`;
    }

    function ContactModalUI() {
      return `
        <div id="contact-modal" class="modal-overlay hidden">
          <div class="glass w-full max-w-lg mx-2 p-5 sm:p-6 max-h-[85vh] overflow-y-auto scrollbar-thin rounded-2xl space-y-4 animate-slide-up">
            <h2 class="text-lg font-bold" id="modal-title">নতুন কন্টাক্ট</h2>
            <input type="text" id="c-name" class="glass-input w-full rounded-xl" placeholder="নাম *">
            <input type="text" id="c-phone" class="glass-input w-full rounded-xl" placeholder="ফোন *">
            <input type="text" id="c-profession" class="glass-input w-full rounded-xl" placeholder="পেশা">
            <input type="text" id="c-address" class="glass-input w-full rounded-xl" placeholder="ঠিকানা">
            <select id="c-category" class="glass-input w-full rounded-xl bg-transparent text-white"></select>
            <select id="c-section" class="glass-input w-full rounded-xl bg-transparent text-white"><option value="">কোন সেকশন নেই</option></select>
            <input type="text" id="c-tags" class="glass-input w-full rounded-xl" placeholder="ট্যাগ: #Manager, #F/A">
            <div class="flex gap-2 pt-1"><button id="btn-save-contact" class="btn-glass btn-primary flex-1 py-2.5 rounded-xl">💾 সেভ</button><button id="btn-cancel-contact" class="btn-glass flex-1 py-2.5 rounded-xl">বাতিল</button></div>
            <div id="modal-error" class="text-red-400 text-xs hidden"></div>
          </div></div>`;
    }
    function ImportModalUI() {
      return `
        <div id="import-modal" class="modal-overlay hidden">
          <div class="glass w-full max-w-md mx-2 p-6 rounded-2xl space-y-4 animate-slide-up">
            <h2 class="text-lg font-bold">📥 VCF ইম্পোর্ট</h2>
            <input type="file" id="vcf-file" accept=".vcf,.vcard,.txt" class="glass-input w-full rounded-xl file:mr-3 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:bg-indigo-500/40 file:text-white file:text-sm">
            <div id="import-status" class="text-sm text-slate-400"></div>
            <div class="flex gap-2"><button id="btn-import-confirm" class="btn-glass btn-success flex-1 py-2.5 rounded-xl">ইম্পোর্ট</button><button id="btn-import-cancel" class="btn-glass flex-1 py-2.5 rounded-xl">বন্ধ</button></div>
          </div></div>`;
    }
    function CategoryManageModalUI() {
      return `
        <div id="cat-modal" class="modal-overlay hidden">
          <div class="glass w-full max-w-lg mx-2 p-5 sm:p-6 max-h-[80vh] overflow-y-auto scrollbar-thin rounded-2xl space-y-4 animate-slide-up">
            <h2 class="text-lg font-bold">📂 ক্যাটাগরি ও সেকশন ম্যানেজমেন্ট</h2>
            <div class="space-y-2" id="cat-list"></div>
            <div class="flex gap-2"><input type="text" id="new-cat-name" class="glass-input flex-1 rounded-xl" placeholder="নতুন ক্যাটাগরি"><button id="btn-add-cat" class="btn-glass btn-primary py-2 px-4 rounded-xl">যোগ করুন</button></div>
            <div class="flex gap-2"><input type="text" id="new-sec-name" class="glass-input flex-1 rounded-xl" placeholder="নতুন সেকশন"><select id="sec-parent-cat" class="glass-input rounded-xl bg-transparent text-white w-40"></select><button id="btn-add-sec" class="btn-glass py-2 px-4 rounded-xl bg-emerald-500/25 border-emerald-400/40">যোগ</button></div>
            <button id="btn-close-cats" class="btn-glass w-full py-2.5 rounded-xl">সম্পন্ন</button>
            <div id="cat-error" class="text-red-400 text-xs hidden"></div>
          </div></div>`;
    }

    // ==================== DASHBOARD LOGIC ====================
    function attachDashboardListeners() {
      $('#btn-logout').onclick = () => signOut(auth);
      $('#btn-add-contact').onclick = () => openContactModal(null);
      $('#btn-cancel-contact').onclick = closeContactModal;
      $('#btn-save-contact').onclick = saveContact;
      $('#btn-import-vcf').onclick = () => $('#import-modal').classList.remove('hidden');
      $('#btn-import-cancel').onclick = () => $('#import-modal').classList.add('hidden');
      $('#btn-import-confirm').onclick = handleVCFImport;
      $('#btn-export-csv').onclick = exportCSV;
      $('#btn-manage-cats').onclick = openCategoryModal;
      $('#btn-close-cats').onclick = () => $('#cat-modal').classList.add('hidden');
      $('#btn-add-cat').onclick = addCategory;
      $('#btn-add-sec').onclick = addSection;
      $('#btn-toggle-view').onclick = toggleView;
      $('#btn-clear-search').onclick = () => { $('#search-input').value=''; AppState.searchQuery=''; renderContactList(); };

      $('#search-input').oninput = (e) => { AppState.searchQuery = e.target.value.toLowerCase(); renderContactList(); };
      $('#filter-category').onchange = (e) => { AppState.selectedCategory = e.target.value; updateFilterSections(); renderContactList(); };
      $('#filter-section').onchange = (e) => { AppState.selectedSection = e.target.value; renderContactList(); };
      $('#c-category').onchange = updateSectionDropdownForForm;

      updateFilterCategoryDropdown();
      updateFilterSections();
    }

    function loadUserData() {
      const userDocRef = doc(db, 'users', AppState.user.uid);
      onSnapshot(userDocRef, (snap) => {
        if (snap.exists()) {
          const d = snap.data();
          AppState.categories = d.categories || [...DEFAULT_CATEGORIES];
          AppState.sections = d.sections || {...DEFAULT_SECTIONS};
        } else {
          AppState.categories = [...DEFAULT_CATEGORIES];
          AppState.sections = {...DEFAULT_SECTIONS};
          setDoc(userDocRef, { categories: AppState.categories, sections: AppState.sections, email: AppState.user.email, updatedAt: serverTimestamp() }, {merge:true});
        }
        updateFilterCategoryDropdown();
        updateFilterSections();
        updateSectionDropdownForForm();
        populateCatModal();
      });
      const qContacts = query(collection(db, 'users', AppState.user.uid, 'contacts'), orderBy('createdAt','desc'));
      onSnapshot(qContacts, (snap) => {
        AppState.contacts = []; snap.forEach(d=>AppState.contacts.push({id:d.id,...d.data()}));
        renderContactList(); updateStats();
      });
    }

    function updateStats() {
      const c = AppState.contacts;
      const villageCat = AppState.categories.find(x=>x.includes('গ্রাম')||x==='Our Village')||'আমাদের গ্রাম';
      const officeCat = AppState.categories.find(x=>x.includes('অফিস')||x==='Office')||'অফিস';
      $('#stat-total').textContent = c.length;
      $('#stat-village').textContent = c.filter(x=>x.category===villageCat).length;
      $('#stat-office').textContent = c.filter(x=>x.category===officeCat).length;
      $('#stat-custom').textContent = c.filter(x=>x.category!==villageCat && x.category!==officeCat).length;
    }

    function updateFilterCategoryDropdown() {
      const sel = $('#filter-category');
      sel.innerHTML = '<option value="All">🗂️ সকল ক্যাটাগরি</option>';
      AppState.categories.forEach(cat => sel.innerHTML += `<option value="${cat}">${cat}</option>`);
    }
    function updateFilterSections() {
      const sel = $('#filter-section');
      sel.innerHTML = '<option value="All">📁 সকল সেকশন</option>';
      if (AppState.selectedCategory!=='All') (AppState.sections[AppState.selectedCategory]||[]).forEach(s=>sel.innerHTML+=`<option value="${s}">${s}</option>`);
    }
    function updateSectionDropdownForForm() {
      const cat = $('#c-category').value;
      const sel = $('#c-section');
      sel.innerHTML = '<option value="">কোন সেকশন নেই</option>';
      (AppState.sections[cat]||[]).forEach(s=>sel.innerHTML+=`<option value="${s}">${s}</option>`);
    }

    function renderContactList() {
      const container = $('#contacts-container');
      let list = AppState.contacts;
      if (AppState.selectedCategory!=='All') list = list.filter(c=>c.category===AppState.selectedCategory);
      if (AppState.selectedSection!=='All') list = list.filter(c=>c.section===AppState.selectedSection);
      if (AppState.searchQuery) {
        const q = AppState.searchQuery;
        list = list.filter(c => (c.name||''+c.phone||''+c.profession||''+(c.tags||[]).join(' ')).toLowerCase().includes(q));
      }
      if (!list.length) {
        container.innerHTML = `<div class="text-center py-14 text-slate-500"><span class="text-4xl block mb-3">📇</span>কোন কন্টাক্ট পাওয়া যায়নি</div>`;
        return;
      }
      const isGrid = AppState.viewMode === 'grid';
      container.className = isGrid ? 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 max-h-[55vh] overflow-y-auto scrollbar-thin pr-0.5' : 'space-y-2 max-h-[55vh] overflow-y-auto scrollbar-thin pr-0.5';
      container.innerHTML = list.map(c => {
        const tags = (c.tags||[]).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('');
        if (isGrid) return `<div class="glass-card p-4 rounded-2xl contact-row"><div class="flex justify-between"><span class="font-semibold">${escapeHtml(c.name)}</span><div class="flex gap-1">${actionButtons(c)}</div></div><p class="text-xs text-slate-400 mt-1">📞 ${escapeHtml(c.phone)}</p><p class="text-xs text-slate-500">${c.category||''} ${c.section?'› '+c.section:''}</p><div class="mt-2">${tags}</div></div>`;
        return `<div class="glass-card p-3 sm:p-4 contact-row flex flex-wrap justify-between items-center gap-2 rounded-2xl"><div class="flex-1 min-w-[160px]"><p class="font-semibold text-sm sm:text-base">${escapeHtml(c.name)}</p><p class="text-xs text-slate-400">📞 ${escapeHtml(c.phone)} ${c.profession?'· '+escapeHtml(c.profession):''}</p><p class="text-[10px] text-slate-500">${c.category||''} ${c.section?'› '+c.section:''} ${c.address?'📍 '+escapeHtml(c.address):''}</p><div class="mt-1">${tags}</div></div><div class="flex gap-1 sm:gap-2">${actionButtons(c)}</div></div>`;
      }).join('');
      function actionButtons(c) {
        const phoneClean = (c.phone||'').replace(/[^0-9+]/g,'');
        return `<a href="tel:${escapeHtml(c.phone)}" class="btn-glass p-1.5 sm:p-2 text-xs" title="কল">📞</a><a href="https://wa.me/${phoneClean}" target="_blank" class="btn-glass p-1.5 sm:p-2 text-xs bg-green-600/20" title="WhatsApp">💬</a><button data-id="${c.id}" class="btn-edit btn-glass p-1.5 sm:p-2 text-xs">✏️</button><button data-id="${c.id}" class="btn-del btn-glass p-1.5 sm:p-2 text-xs btn-danger">🗑️</button>`;
      }
      container.querySelectorAll('.btn-edit').forEach(b=>b.onclick=(e)=>{ const c=AppState.contacts.find(x=>x.id===e.currentTarget.dataset.id); if(c)openContactModal(c); });
      container.querySelectorAll('.btn-del').forEach(b=>b.onclick=async(e)=>{ if(confirm('ডিলিট করবেন?')) await deleteDoc(doc(db,'users',AppState.user.uid,'contacts',e.currentTarget.dataset.id)); });
    }

    function openContactModal(contact) {
      AppState.editingContact = contact;
      $('#contact-modal').classList.remove('hidden');
      $('#modal-title').textContent = contact ? '✏️ কন্টাক্ট এডিট' : '➕ নতুন কন্টাক্ট';
      const catSel = $('#c-category');
      catSel.innerHTML = AppState.categories.map(c=>`<option value="${c}">${c}</option>`).join('');
      $('#c-name').value = contact?.name || '';
      $('#c-phone').value = contact?.phone || '';
      $('#c-profession').value = contact?.profession || '';
      $('#c-address').value = contact?.address || '';
      catSel.value = contact?.category || AppState.categories[0] || '';
      updateSectionDropdownForForm();
      $('#c-section').value = contact?.section || '';
      $('#c-tags').value = (contact?.tags||[]).join(', ');
      $('#modal-error').classList.add('hidden');
    }
    function closeContactModal() { $('#contact-modal').classList.add('hidden'); AppState.editingContact=null; }
    async function saveContact() {
      const name = $('#c-name').value.trim(), phone = $('#c-phone').value.trim();
      if(!name||!phone) { $('#modal-error').textContent='নাম ও ফোন আবশ্যক'; $('#modal-error').classList.remove('hidden'); return; }
      const data = { name, phone, profession:$('#c-profession').value.trim(), address:$('#c-address').value.trim(), category:$('#c-category').value, section:$('#c-section').value||null, tags:$('#c-tags').value.split(',').map(t=>t.trim()).filter(Boolean), updatedAt:serverTimestamp() };
      try {
        if(AppState.editingContact) await updateDoc(doc(db,'users',AppState.user.uid,'contacts',AppState.editingContact.id), data);
        else { data.createdAt=serverTimestamp(); await setDoc(doc(collection(db,'users',AppState.user.uid,'contacts')), data); }
        closeContactModal(); showToast('✅ সফলভাবে সেভ হয়েছে','success');
      } catch(e) { $('#modal-error').textContent='সেভ ত্রুটি'; $('#modal-error').classList.remove('hidden'); }
    }

    async function handleVCFImport() {
      const file = $('#vcf-file').files?.[0];
      if(!file) { $('#import-status').textContent='⚠️ ফাইল সিলেক্ট করুন'; return; }
      const text = await file.text();
      const vcards = text.split('END:VCARD').filter(b=>b.trim()).map(b=>b+'END:VCARD');
      let imported=0; const batch=writeBatch(db); const ref=collection(db,'users',AppState.user.uid,'contacts');
      for(const vc of vcards) {
        const nm=vc.match(/FN:(.*)/), tel=vc.match(/TEL[^:]*:(.*)/);
        if(nm&&tel) { const nd=doc(ref); batch.set(nd,{name:nm[1].trim(),phone:tel[1].trim().replace(/[\s\-\(\)]/g,''),profession:'',address:'',category:AppState.categories[0]||'আমাদের গ্রাম',section:null,tags:[],createdAt:serverTimestamp(),updatedAt:serverTimestamp()}); imported++; }
      }
      if(imported>0){ await batch.commit(); $('#import-status').textContent=`✅ ${imported}টি ইম্পোর্ট হয়েছে`; showToast(`${imported} কন্টাক্ট ইম্পোর্ট`,'success'); }
      else $('#import-status').textContent='❌ কোন কন্টাক্ট পাওয়া যায়নি';
    }

    function exportCSV() {
      let csv='Name,Phone,Profession,Address,Category,Section,Tags\n';
      AppState.contacts.forEach(c=>csv+=`"${c.name}","${c.phone}","${c.profession||''}","${c.address||''}","${c.category||''}","${c.section||''}","${(c.tags||[]).join(';')}"\n`);
      const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='jrs_contacts.csv'; a.click(); showToast('📤 CSV ডাউনলোড শুরু','info');
    }

    function toggleView() {
      AppState.viewMode = AppState.viewMode==='list'?'grid':'list';
      $('#btn-toggle-view').textContent = AppState.viewMode==='grid'?'📋':'� grids';
      renderContactList();
    }

    // ----- Category Management -----
    function openCategoryModal() { populateCatModal(); $('#cat-modal').classList.remove('hidden'); }
    function populateCatModal() {
      const list = $('#cat-list');
      list.innerHTML = AppState.categories.map(cat => `
        <div class="glass-card p-3 rounded-xl flex flex-wrap justify-between items-center gap-2">
          <div><span class="font-medium">📁 ${escapeHtml(cat)}</span><div class="flex flex-wrap gap-1 mt-1">${(AppState.sections[cat]||[]).map(s=>`<span class="text-xs bg-white/10 px-2 py-0.5 rounded-full flex items-center gap-1">${escapeHtml(s)}<button class="text-red-400 hover:text-red-300 ml-0.5 del-sec" data-cat="${escapeHtml(cat)}" data-sec="${escapeHtml(s)}">×</button></span>`).join('')}</div></div>
          <button class="btn-glass btn-danger text-xs px-3 py-1 del-cat" data-cat="${escapeHtml(cat)}">🗑️</button>
        </div>`).join('');
      list.querySelectorAll('.del-cat').forEach(b=>b.onclick=async(e)=>{ const cat=e.currentTarget.dataset.cat; if(confirm(`"${cat}" ও এর সকল সেকশন ডিলিট করবেন?`)) { AppState.categories=AppState.categories.filter(c=>c!==cat); delete AppState.sections[cat]; await saveCats(); populateCatModal(); showToast('ক্যাটাগরি ডিলিট হয়েছে','info'); } });
      list.querySelectorAll('.del-sec').forEach(b=>b.onclick=async(e)=>{ const{cat,sec}=e.currentTarget.dataset; AppState.sections[cat]=(AppState.sections[cat]||[]).filter(s=>s!==sec); await saveCats(); populateCatModal(); });
      const secPar = $('#sec-parent-cat'); secPar.innerHTML = AppState.categories.map(c=>`<option value="${c}">${c}</option>`).join('');
    }
    async function addCategory() {
      const name = $('#new-cat-name').value.trim();
      if(!name) return showCatError('নাম দিন'); if(AppState.categories.includes(name)) return showCatError('ইতিমধ্যে আছে');
      AppState.categories.push(name); AppState.sections[name]=[]; await saveCats(); $('#new-cat-name').value=''; populateCatModal(); updateFilterCategoryDropdown(); showToast('✅ ক্যাটাগরি যোগ হয়েছে','success');
    }
    async function addSection() {
      const name = $('#new-sec-name').value.trim(), cat = $('#sec-parent-cat').value;
      if(!name) return showCatError('সেকশনের নাম দিন'); if((AppState.sections[cat]||[]).includes(name)) return showCatError('ইতিমধ্যে আছে');
      AppState.sections[cat] = [...(AppState.sections[cat]||[]), name]; await saveCats(); $('#new-sec-name').value=''; populateCatModal(); updateFilterSections(); showToast('✅ সেকশন যোগ হয়েছে','success');
    }
    function showCatError(m) { const e=$('#cat-error'); e.textContent=m; e.classList.remove('hidden'); setTimeout(()=>e.classList.add('hidden'),2000); }
    async function saveCats() {
      await setDoc(doc(db,'users',AppState.user.uid),{categories:AppState.categories, sections:AppState.sections, updatedAt:serverTimestamp()},{merge:true});
    }

    onAuthStateChanged(auth, (user) => { AppState.user = user; renderApp(); });
    renderApp();
  </script>
</body>
</html>
